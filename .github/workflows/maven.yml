name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check test data
        run: |
          echo "Checking test data folder..."
          ls -la src/test/resources/testdata/
          echo "Checking all test resources..."
          find src/test/resources -type f

      - name: Run tests
        run: mvn clean test
