# Valid locators for login page
login.username=//input[@name='username']
login.password=//input[@name='password']
login.button=//button[@type='submit']
login.dashboard=//div[@class='oxd-topbar-header-title']

# Error locator
login.error=//p[contains(@class,'oxd-alert-content-text')]
login.required=//span[contains(@class,'oxd-input-field-error-message')]

# Expected error texts
login.errorText.invalid=Invalid credentials
login.errorText.emptyUsername=Required
login.errorText.emptyPassword=Required

# Logout locators
logout.dropdown=//span[@class='oxd-userdropdown-tab']
logout.option=//a[text()='Logout']